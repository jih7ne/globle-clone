name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-vitest
          path: allure-results
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 7
      - run: npm run build -w @gw/web
      - name: Bundle the Worker
        run: npx wrangler deploy --dry-run --outdir dist
        working-directory: apps/api

  e2e:
    # Browser tests: the production build against a local Worker and database, one runner
    # per engine (NFR-10).
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            projects: --project=desktop --project=mobile
          - browser: firefox
            projects: --project=firefox
          - browser: webkit
            projects: --project=webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:e2e -- ${{ matrix.projects }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  lighthouse:
    # NFR-06 and a v1 acceptance criterion: Lighthouse mobile performance of at least 85
    # (median of 3 runs) on the production build, with a local Worker behind it.
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @gw/web
      - name: Start the local Worker and the built site
        run: |
          (cd apps/api && npx wrangler d1 migrations apply getting-warmer --local --persist-to ../../.wrangler-e2e             && npx wrangler dev --port 8788 --persist-to ../../.wrangler-e2e                --var SECRET:lighthouse-secret --var TOKEN_KEY:lighthouse-token-key > ../../worker.log 2>&1 &)
          (cd apps/web && API_URL=http://localhost:8788 npx vite preview --port 4174 --strictPort > ../../site.log 2>&1 &)
          for i in $(seq 90); do curl -sf http://localhost:4174/api/health && exit 0; sleep 2; done
          cat worker.log site.log
          exit 1
      - run: npx lhci collect
      - run: npx lhci upload
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: lighthouse-report
          retention-days: 30
      - run: npx lhci assert

  report:
    # One Allure report for every test level and browser, downloadable from the run.
    runs-on: ubuntu-latest
    needs: [check, e2e]
    if: always() && needs.check.result != 'skipped'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true
      - run: npx allure generate allure-results
      - uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 30

  deploy:
    # Production on master, a Pages preview per pull request (specification, section 9).
    # Skipped until the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are set,
    # and on pull requests from forks, which get no secrets.
    runs-on: ubuntu-latest
    needs: [check, e2e, lighthouse]
    outputs:
      url: ${{ steps.pages.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: env.CLOUDFLARE_API_TOKEN != ''
      - name: Database migrations
        if: env.CLOUDFLARE_API_TOKEN != '' && github.ref == 'refs/heads/master'
        run: npx wrangler d1 migrations apply getting-warmer --remote
        working-directory: apps/api
      - name: Deploy the Worker
        if: env.CLOUDFLARE_API_TOKEN != '' && github.ref == 'refs/heads/master'
        run: npx wrangler deploy
        working-directory: apps/api
      - run: npm run build -w @gw/web
        if: env.CLOUDFLARE_API_TOKEN != ''
      - name: Deploy the site
        id: pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx wrangler pages deploy --branch "${{ github.head_ref || github.ref_name }}" | tee deploy.log
          echo "url=$(grep -o 'https://[a-zA-Z0-9.-]*\.pages\.dev' deploy.log | tail -1)" >> "$GITHUB_OUTPUT"
        working-directory: apps/web

  smoke:
    # The tests tagged @smoke against what was just deployed: the pull request's Pages
    # preview, or production on master. It runs on the production API, so these tests need
    # no secret and never record a game.
    runs-on: ubuntu-latest
    needs: deploy
    if: needs.deploy.outputs.url != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ needs.deploy.outputs.url }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-smoke
          path: |
            playwright-report
            test-results
          retention-days: 7

  badges:
    # README badges: coverage and Lighthouse scores of master, as shields.io endpoint files
    # on the `badges` branch.
    runs-on: ubuntu-latest
    needs: [check, lighthouse]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coverage-summary
          path: badge-input
      - uses: actions/download-artifact@v4
        with:
          name: lighthouse-report
          path: badge-input/lighthouse
      - run: node .github/scripts/badges.mjs badge-input badges
      - name: Publish to the badges branch
        working-directory: badges
        run: |
          git init -q -b badges
          git add .
          git -c user.name="github-actions[bot]"               -c user.email="41898282+github-actions[bot]@users.noreply.github.com"               commit -q -m "Badges for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" badges
