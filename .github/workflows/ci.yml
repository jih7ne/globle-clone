name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-vitest
          path: allure-results
          retention-days: 7
      - run: npm run build -w @gw/web
      - name: Bundle the Worker
        run: npx wrangler deploy --dry-run --outdir dist
        working-directory: apps/api

  e2e:
    # Browser tests: the production build against a local Worker and database, one runner
    # per engine (NFR-10).
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            projects: --project=desktop --project=mobile
          - browser: firefox
            projects: --project=firefox
          - browser: webkit
            projects: --project=webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:e2e -- ${{ matrix.projects }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  report:
    # One Allure report for every test level and browser, downloadable from the run.
    runs-on: ubuntu-latest
    needs: [check, e2e]
    if: always() && needs.check.result != 'skipped'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true
      - run: npx allure generate allure-results
      - uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 30

  deploy:
    # Production on master, a Pages preview per pull request (specification, section 9).
    # Skipped until the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are set,
    # and on pull requests from forks, which get no secrets.
    runs-on: ubuntu-latest
    needs: [check, e2e]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: env.CLOUDFLARE_API_TOKEN != ''
      - name: Database migrations
        if: env.CLOUDFLARE_API_TOKEN != '' && github.ref == 'refs/heads/master'
        run: npx wrangler d1 migrations apply getting-warmer --remote
        working-directory: apps/api
      - name: Deploy the Worker
        if: env.CLOUDFLARE_API_TOKEN != '' && github.ref == 'refs/heads/master'
        run: npx wrangler deploy
        working-directory: apps/api
      - run: npm run build -w @gw/web
        if: env.CLOUDFLARE_API_TOKEN != ''
      - name: Deploy the site
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler pages deploy --branch "${{ github.head_ref || github.ref_name }}"
        working-directory: apps/web
